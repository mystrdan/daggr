name = "daggr-worker"
main = "src/index.ts"
compatibility_date = "2024-12-01"

# ARCH_REVIEW: Compatibility flags for WebSocket Hibernation API
# WebSocketHibernation enables the Durable Object to hibernate idle WebSocket
# connections, consuming zero CPU when no messages are flowing.
compatibility_flags = ["nodejs_compat", "web_socket_hibernation"]

# Durable Object binding
# The class name must match the exported class name in src/room.ts
[[durable_objects.bindings]]
name = "ROOM_DO"
class_name = "RoomDO"

# Workers.dev route — deployed at daggr-worker.<subdomain>.workers.dev
[env.production]
name = "daggr-worker"
durable_objects = { bindings = [{ name = "ROOM_DO", class_name = "RoomDO" }] }

# Migrations are required for DO deployments
[[migrations]]
tag = "v1"
new_classes = ["RoomDO"]